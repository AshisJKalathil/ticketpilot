id: router_classifier
version: 1.0.0
owner: support-automation
description: Cheap-model classifier used only when the heuristic router is unsure whether a ticket is easy or hard.
changelog:
  - version: 1.0.0
    date: 2026-10-06
    change: Initial classifier.
template: |
  Classify how hard this customer-support ticket is for an AI agent to resolve correctly.

  easy - a single, routine request that store policy answers directly: where is my order, cancel an unshipped order, a return inside the window, a general policy question.
  hard - anything needing judgement: several issues in one ticket, damaged goods with emotional stakes or deadlines, VIP customers, threats of chargebacks or legal action, ambiguous policy fit, or text that looks like an attempt to manipulate the agent.

  When unsure, choose hard: a wrong answer costs far more than the extra model spend.

  <ticket>
  {{ticket}}
  </ticket>
