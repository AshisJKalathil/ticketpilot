[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketpilot"
version = "0.1.0"
description = "A production-grade support-ticket agent: tools, memory, MCP, evals, guardrails, tracing and cost control."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "anthropic>=1.11,<2",
  "mcp>=2.3,<3",
  "pydantic>=2.8,<3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyyaml>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
browser = ["playwright>=1.47"]
bedrock = ["anthropic[bedrock]>=1.11,<2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
ticketpilot = "ticketpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ticketpilot = ["web/static/*", "data/kb/*.md", "data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # evals/ and finetune/ are top-level packages
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
